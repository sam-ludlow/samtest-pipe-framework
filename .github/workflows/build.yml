name: Manual Build and Release

on:
  workflow_dispatch:
    inputs:
      old_tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from AssemblyInfo
        id: get_version
        shell: powershell
        run: |




            $content = Get-Content -Path "Properties/AssemblyInfo.cs" -Raw

            if ($content -match 'AssemblyVersion\("([^"]+)"\)') {
              $version = $Matches[1]
              Write-Host "Found version: $version"
              # Set the output for use in later steps
              Write-Output "::set-output name=version::$version"
            } else {
              Write-Host "::error::Could not find AssemblyVersion in AssemblyInfo.cs"
              exit 1
            }
