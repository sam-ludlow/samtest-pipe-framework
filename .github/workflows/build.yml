name: Manual Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore samtest-pipe-framework.sln

      - name: Build the solution
        run: msbuild samtest-pipe-framework.sln /p:Configuration=Release

      - name: Create ZIP of binaries
        run: |
          mkdir release
          xcopy /s /y /i "samtest-pipe-framework\bin\Release" release
          powershell Compress-Archive -Path release\* -DestinationPath output.zip

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.tag_name }}
          name: Release ${{ inputs.tag_name }}
          artifacts: output.zip
          token: ${{ secrets.SAMTEST_PIPE_FRAMEWORK_BUILD }}


