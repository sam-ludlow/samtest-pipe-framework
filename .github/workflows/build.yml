name: Manual Build and Release

on:
  workflow_dispatch:
    inputs:
      old_tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        type: string

env:
  TAG_NAME: '000'

jobs:
  build:
    runs-on: windows-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Version from AssemblyInfo
        shell: pwsh
        run: |
          $content = Get-Content -Path "Properties/AssemblyInfo.cs" -Raw
          if ($content -match 'AssemblyVersion\("([^"]+)"\)') {
            $version = $Matches[1]
            Write-Host "Found version: $version"

            "TAG_NAME=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          } else {
            Write-Host "::error::Could not find AssemblyVersion in AssemblyInfo.cs"
            exit 1
          }

      - name: Validate Version
        shell: pwsh
        run: |
          Write-Host "VERSION is: $env:TAG_NAME"
          # git fetch --tags
          # $existingTags = git tag
          # if ($existingTags -contains $env:TAG_NAME) {
          #   Write-Host "Tag $env:TAG_NAME already exists"
          #   exit 1
          # }


          $tag = $env:TAG_NAME
          git ls-remote --exit-code --tags origin "refs/tags/$tag" *> $null

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Tag $tag exists on remote."
            exit 1
          } else {
            Write-Host "Tag $tag does not exist on remote."
          }


          # Write-Host "Tag OK $env:TAG_NAME"
          exit 1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: nuget restore samtest-pipe-framework.sln

      - name: Build the solution
        run: msbuild samtest-pipe-framework.sln /p:Configuration=Release

      - name: List output folders after build
        run: |
          echo "Searching for EXEs or DLLs:"
          Get-ChildItem -Recurse -Filter *.exe
          Get-ChildItem -Recurse -Filter *.dll

      - name: Create ZIP of binaries
        run: |
          dir
          mkdir release
          xcopy /s /y /i "bin\Release" release
          powershell Compress-Archive -Path release\* -DestinationPath output.zip

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          artifacts: output.zip
          token: ${{ secrets.SAMTEST_PIPE_FRAMEWORK_BUILD }}


